<svg viewBox="0 0 450 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wrBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ede5d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0d6c6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wrGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A820;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8960F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wrHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <filter id="wrShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0a0a0f" flood-opacity="0.4"/>
    </filter>
    <filter id="wrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#f5f0e8" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#wrShadow)">
    <!-- Battlements (3 notches) -->
    <rect x="120" y="58" width="58" height="60" rx="3" fill="url(#wrBody)" stroke="#1a1a2e" stroke-width="5"/>
    <rect x="185" y="58" width="80" height="60" rx="3" fill="url(#wrBody)" stroke="#1a1a2e" stroke-width="5"/>
    <rect x="272" y="58" width="58" height="60" rx="3" fill="url(#wrBody)" stroke="#1a1a2e" stroke-width="5"/>
    <!-- Gold caps on battlements -->
    <rect x="120" y="55" width="58" height="12" rx="3" fill="url(#wrGold)" stroke="#1a1a2e" stroke-width="3"/>
    <rect x="185" y="55" width="80" height="12" rx="3" fill="url(#wrGold)" stroke="#1a1a2e" stroke-width="3"/>
    <rect x="272" y="55" width="58" height="12" rx="3" fill="url(#wrGold)" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Top flat section connecting battlements -->
    <path d="M120,118 L120,128 L330,128 L330,118 L272,118 L265,118 L185,118 L178,118 L120,118 Z" fill="url(#wrBody)" stroke="#1a1a2e" stroke-width="4"/>
    <!-- Top rim -->
    <rect x="120" y="125" width="210" height="18" rx="4" fill="url(#wrGold)" stroke="#1a1a2e" stroke-width="4"/>
    <!-- Main tower body -->
    <path d="M120,143 L120,305 Q120,318 115,328 L110,335 Q105,350 125,365 L325,365 Q345,350 340,335 L335,328 Q330,318 330,305 L330,143" fill="url(#wrBody)" stroke="#1a1a2e" stroke-width="5"/>
    <!-- Inner highlight -->
    <path d="M210,150 Q210,200 210,260 L210,310 L230,310 L230,260 L230,200 L230,150 Z" fill="url(#wrHighlight)" opacity="0.4"/>
    <!-- Window cutouts -->
    <rect x="175" y="185" width="45" height="55" rx="10" fill="#e0d6c6" stroke="#1a1a2e" stroke-width="4"/>
    <rect x="230" y="185" width="45" height="55" rx="10" fill="#e0d6c6" stroke="#1a1a2e" stroke-width="4"/>
    <rect x="175" y="260" width="45" height="55" rx="10" fill="#e0d6c6" stroke="#1a1a2e" stroke-width="4"/>
    <rect x="230" y="260" width="45" height="55" rx="10" fill="#e0d6c6" stroke="#1a1a2e" stroke-width="4"/>
    <!-- Base ring -->
    <ellipse cx="225" cy="365" rx="125" ry="20" fill="url(#wrGold)" stroke="#1a1a2e" stroke-width="4"/>
    <!-- Base -->
    <path d="M100,365 Q95,380 103,388 Q123,398 225,398 Q327,398 347,388 Q355,380 350,365" fill="url(#wrBody)" stroke="#1a1a2e" stroke-width="5"/>
    <!-- Base bottom -->
    <ellipse cx="225" cy="398" rx="123" ry="16" fill="url(#wrGold)" stroke="#1a1a2e" stroke-width="4"/>
    <!-- Inner glow overlay -->
    <path d="M120,143 L120,305 Q120,318 115,328 L110,335 Q105,350 125,365 L325,365 Q345,350 340,335 L335,328 Q330,318 330,305 L330,143" fill="none" stroke="#f5f0e8" stroke-width="2" opacity="0.4" filter="url(#wrGlow)"/>
  </g>
</svg>