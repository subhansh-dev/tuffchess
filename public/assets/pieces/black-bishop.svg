<svg viewBox="0 0 450 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bbBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#141425;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bbGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A820;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8960F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bbHighlight" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a5e;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0" />
    </linearGradient>
    <filter id="bbShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0a0a0f" flood-opacity="0.55"/>
    </filter>
    <filter id="bbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#D4A820" flood-opacity="0.15" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#bbShadow)">
    <!-- Mitre top point -->
    <path d="M225,35 L188,95 Q182,102 185,112 L188,120 Q192,125 198,128 L198,135 L252,135 L252,128 Q258,125 262,120 L265,112 Q268,102 262,95 L225,35 Z" fill="url(#bbBody)" stroke="#0a0a0f" stroke-width="5"/>
    <!-- Gold ball on top of mitre -->
    <circle cx="225" cy="38" r="10" fill="url(#bbGold)" stroke="#0a0a0f" stroke-width="4"/>
    <!-- Diagonal slit -->
    <line x1="188" y1="78" x2="265" y2="115" stroke="#3a3a5e" stroke-width="4" stroke-linecap="round"/>
    <line x1="188" y1="78" x2="265" y2="115" stroke="#D4A820" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Mitre band -->
    <ellipse cx="225" cy="135" rx="70" ry="14" fill="url(#bbGold)" stroke="#0a0a0f" stroke-width="4"/>
    <!-- Head/neck -->
    <path d="M198,135 Q192,150 188,170 L182,190 Q178,205 182,218 L190,235 Q195,242 205,248 L245,248 Q255,242 260,235 L268,218 Q272,205 268,190 L262,170 Q258,150 252,135" fill="url(#bbBody)" stroke="#0a0a0f" stroke-width="5"/>
    <!-- Collar ring -->
    <ellipse cx="225" cy="190" rx="55" ry="12" fill="url(#bbGold)" stroke="#0a0a0f" stroke-width="3"/>
    <!-- Inner highlight on mitre -->
    <path d="M225,45 L215,82 Q212,88 215,95 L220,100 Q225,105 230,100 L235,95 Q238,88 235,82 L225,45 Z" fill="url(#bbHighlight)" opacity="0.5"/>
    <!-- Body -->
    <path d="M205,248 Q182,265 168,295 Q150,330 140,358 Q130,385 145,405 L305,405 Q320,385 310,358 Q300,330 282,295 Q268,265 245,248 Z" fill="url(#bbBody)" stroke="#0a0a0f" stroke-width="5"/>
    <!-- Inner highlight on body -->
    <path d="M215,268 Q205,290 200,330 Q195,370 205,395 L240,395 Q235,370 240,330 Q245,290 250,268 Z" fill="url(#bbHighlight)" opacity="0.4"/>
    <!-- Base ring -->
    <ellipse cx="225" cy="405" rx="115" ry="20" fill="url(#bbGold)" stroke="#0a0a0f" stroke-width="4"/>
    <!-- Base -->
    <path d="M110,405 Q105,420 112,428 Q130,438 225,438 Q320,438 338,428 Q345,420 340,405" fill="url(#bbBody)" stroke="#0a0a0f" stroke-width="5"/>
    <!-- Base bottom -->
    <ellipse cx="225" cy="438" rx="113" ry="14" fill="url(#bbGold)" stroke="#0a0a0f" stroke-width="4"/>
    <!-- Outer glow overlay -->
    <path d="M205,248 Q182,265 168,295 Q150,330 140,358 Q130,385 145,405 L305,405 Q320,385 310,358 Q300,330 282,295 Q268,265 245,248 Z" fill="none" stroke="#D4A820" stroke-width="1" opacity="0.2" filter="url(#bbGlow)"/>
  </g>
</svg>