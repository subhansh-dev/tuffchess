<svg viewBox="0 0 450 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wqBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ede5d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0d6c6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wqGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A820;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8960F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wqHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <filter id="wqShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0a0a0f" flood-opacity="0.4"/>
    </filter>
    <filter id="wqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#f5f0e8" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#wqShadow)">
    <!-- Top ball -->
    <circle cx="225" cy="52" r="16" fill="url(#wqGold)" stroke="#1a1a2e" stroke-width="5"/>
    <!-- Coronet points (5 points) -->
    <path d="M148,135 L158,75 L178,105 L198,58 L218,92 L225,55 L232,92 L252,58 L272,105 L292,75 L302,135 Z" fill="url(#wqBody)" stroke="#1a1a2e" stroke-width="5"/>
    <!-- Gold tips on points -->
    <circle cx="158" cy="75" r="7" fill="url(#wqGold)" stroke="#1a1a2e" stroke-width="3"/>
    <circle cx="198" cy="58" r="7" fill="url(#wqGold)" stroke="#1a1a2e" stroke-width="3"/>
    <circle cx="252" cy="58" r="7" fill="url(#wqGold)" stroke="#1a1a2e" stroke-width="3"/>
    <circle cx="292" cy="75" r="7" fill="url(#wqGold)" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Crown band -->
    <ellipse cx="225" cy="135" rx="78" ry="16" fill="url(#wqGold)" stroke="#1a1a2e" stroke-width="4"/>
    <!-- Crown body -->
    <path d="M147,135 L147,150 Q147,158 155,162 L175,168 Q182,172 182,178 L182,185 L268,185 L268,178 Q268,172 275,168 L295,162 Q303,158 303,150 L303,135" fill="url(#wqBody)" stroke="#1a1a2e" stroke-width="5"/>
    <!-- Neck taper -->
    <path d="M182,185 Q182,198 175,212 L168,225 Q163,238 168,250 L180,268 Q185,274 192,278 L258,278 Q265,274 270,268 L282,250 Q287,238 282,225 L275,212 Q268,198 268,185 Z" fill="url(#wqBody)" stroke="#1a1a2e" stroke-width="5"/>
    <!-- Collar ring -->
    <ellipse cx="225" cy="225" rx="58" ry="12" fill="url(#wqGold)" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Body -->
    <path d="M192,278 Q170,295 155,318 Q138,348 128,372 Q118,395 135,412 L315,412 Q332,395 322,372 Q312,348 295,318 Q280,295 258,278 Z" fill="url(#wqBody)" stroke="#1a1a2e" stroke-width="5"/>
    <!-- Inner highlight -->
    <path d="M215,295 Q205,315 200,348 Q195,378 205,400 L240,400 Q235,378 240,348 Q245,315 250,295 Z" fill="url(#wqHighlight)" opacity="0.5"/>
    <!-- Base ring -->
    <ellipse cx="225" cy="412" rx="120" ry="20" fill="url(#wqGold)" stroke="#1a1a2e" stroke-width="4"/>
    <!-- Base -->
    <path d="M105,412 Q100,425 108,432 Q128,440 225,440 Q322,440 342,432 Q350,425 345,412" fill="url(#wqBody)" stroke="#1a1a2e" stroke-width="5"/>
    <!-- Base bottom -->
    <ellipse cx="225" cy="440" rx="118" ry="16" fill="url(#wqGold)" stroke="#1a1a2e" stroke-width="4"/>
    <!-- Inner glow overlay -->
    <path d="M192,278 Q170,295 155,318 Q138,348 128,372 Q118,395 135,412 L315,412 Q332,395 322,372 Q312,348 295,318 Q280,295 258,278 Z" fill="none" stroke="#f5f0e8" stroke-width="2" opacity="0.4" filter="url(#wqGlow)"/>
  </g>
</svg>